<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stay focused · FocusPro</title>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --border: #e4e4e7;
      --ink: #18181b;
      --muted: #71717a;
      --soft: #f4f4f5;
      --brand: #0f766e;
      --brand-strong: #115e59;
      --brand-soft: #f0fdfa;
      --brand-ring: #99f6e4;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(60rem 30rem at 50% -10%, #ccfbf1 0%, rgba(204, 251, 241, 0) 60%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 28px;
      font-weight: 600;
      font-size: 15px;
    }
    header span b { color: var(--brand); font-weight: 600; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 20px 40px;
      text-align: center;
    }

    /* Breathing circle */
    .breath {
      position: relative;
      width: 184px;
      height: 184px;
      display: grid;
      place-items: center;
      margin-bottom: 36px;
    }
    .breath .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--brand-soft);
      border: 1px solid var(--brand-ring);
      animation: breathe 8s ease-in-out infinite;
    }
    .breath .ring.outer {
      inset: -18px;
      background: transparent;
      border-color: rgba(153, 246, 228, 0.6);
      animation-delay: 0.25s;
    }
    .breath .core {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 30px -10px rgba(15, 118, 110, 0.55);
    }
    .breath-label {
      position: absolute;
      bottom: -30px;
      left: 0;
      right: 0;
      font-size: 13px;
      color: var(--muted);
      transition: opacity 0.4s ease;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.82); opacity: 0.7; }
      50% { transform: scale(1); opacity: 1; }
    }

    h1 {
      margin: 18px 0 0;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 10px auto 0;
      max-width: 30rem;
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
    }
    .lead strong { color: var(--ink); font-weight: 600; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
    .btn-primary { background: var(--brand); color: #fff; border: 1px solid var(--brand); }
    .btn-primary:hover { background: var(--brand-strong); }
    .btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--soft); }

    .panel {
      width: 100%;
      max-width: 30rem;
      margin-top: 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(24, 24, 27, 0.05);
      text-align: left;
    }
    .panel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
    }
    .panel-row + .panel-row { border-top: 1px solid var(--soft); }
    .panel-label { font-size: 13px; color: var(--muted); }
    .panel-value { font-size: 14px; font-weight: 600; }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;
      background: #14b8a6;
      box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.15);
      vertical-align: 1px;
    }
    .chips { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .chip {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--soft);
      color: #52525b;
      border: 1px solid var(--border);
    }
    .chip.current { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }

    .tip {
      max-width: 30rem;
      margin: 28px auto 0;
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
    }
    .tip b { color: var(--ink); font-weight: 600; }

    footer {
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: #a1a1aa;
    }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      .breath .ring { animation: none; transform: scale(0.92); }
    }
  </style>
</head>
<body>
  <header>
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
      <rect width="28" height="28" rx="8" fill="#0f766e"/>
      <circle cx="14" cy="14" r="7" stroke="white" stroke-opacity=".35" stroke-width="2.25"/>
      <path d="M14 7a7 7 0 0 1 7 7" stroke="white" stroke-width="2.25" stroke-linecap="round"/>
      <circle cx="14" cy="14" r="1.75" fill="white"/>
    </svg>
    <span>Focus<b>Pro</b> · Focus Blocker</span>
  </header>

  <main>
    <div class="breath" aria-hidden="true">
      <div class="ring outer"></div>
      <div class="ring"></div>
      <div class="core">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div class="breath-label" id="breathLabel">Breathe in</div>
    </div>

    <h1>Stay focused</h1>
    <p class="lead" id="lead">This site is blocked while your focus session is running.</p>

    <div class="actions">
      <a class="btn btn-primary" id="backToSession" href="http://127.0.0.1:8000/pomodoro">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
        Back to my session
      </a>
      <button type="button" class="btn btn-secondary" id="closeTab">Close this tab</button>
    </div>

    <section class="panel" aria-label="Session details">
      <div class="panel-row">
        <span class="panel-label">Status</span>
        <span class="panel-value" id="sessionStatus"><span class="status-dot"></span>Focus session in progress</span>
      </div>
      <div class="panel-row" id="sitesRow" hidden>
        <span class="panel-label">Blocked this session</span>
        <span class="chips" id="sites"></span>
      </div>
      <div class="panel-row" id="countRow" hidden>
        <span class="panel-label">Distractions blocked today</span>
        <span class="panel-value" id="blockedCount">0</span>
      </div>
    </section>

    <p class="tip" id="tip"></p>
  </main>

  <footer>Your timer is still running in FocusPro. This tab unblocks when the session ends.</footer>

  <script src="blocked.js"></script>
</body>
</html>
